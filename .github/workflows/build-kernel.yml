name: Build Kernel (Bazel/Kleaf)

on:
  workflow_dispatch:
    inputs:
      manifest_branch:
        description: "Branch manifest AOSP kernel (harus sesuai versi kernel)"
        default: "common-android16-6.12-2025-09"
      target:
        description: "Target Bazel"
        default: "//common:kernel_aarch64_dist"
      lto:
        description: "Mode LTO (none/thin/full)"
        default: "thin"

env:
  MANIFEST_BRANCH: ${{ inputs.manifest_branch || 'common-android16-6.12-2025-09' }}
  BAZEL_TARGET: ${{ inputs.target || '//common:kernel_aarch64_dist' }}
  LTO: ${{ inputs.lto || 'thin' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Bebaskan ruang disk
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: true

      - name: Checkout fork ini (source kernel)
        uses: actions/checkout@v4
        with:
          path: common-src
          fetch-depth: 1

      - name: Install dependensi
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git-core gnupg flex bison build-essential zip curl unzip \
            zlib1g-dev libc6-dev-i386 libncurses-dev libssl-dev \
            libxml2-utils xsltproc fontconfig python3 rsync
          mkdir -p ~/bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
          chmod +x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Sync workspace Kleaf (build/kernel, toolchain, dll)
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git config --global color.ui false
          mkdir kernel && cd kernel
          repo init -u https://android.googlesource.com/kernel/manifest \
            -b "$MANIFEST_BRANCH" --depth=1 --no-tags
          repo sync -c -j8 --no-tags --no-clone-bundle --fail-fast

      - name: Ganti common bawaan AOSP dengan fork ini
        run: |
          rm -rf kernel/common
          mv common-src kernel/common

      - name: Build dengan Bazel
        working-directory: kernel
        run: |
          tools/bazel run \
            --lto="$LTO" \
            "$BAZEL_TARGET" \
            -- --destdir="$GITHUB_WORKSPACE/dist"

      - name: Daftar hasil build
        if: always()
        run: ls -lah dist || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-dist
          path: dist/
          if-no-files-found: error
